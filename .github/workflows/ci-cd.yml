# CI on every pull request; deploy to Cloud Run on every merge (push) to main.
# Only the service whose folder changed is checked and deployed (agent/ -> saathi-api, web/ -> saathi-web).
# Auth is keyless: GitHub OIDC -> Workload Identity Federation -> github-deployer service account.
# The WIF provider only accepts workflows from ojha-436/Saathi running on refs/heads/main.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to redeploy
        type: choice
        options: [both, api, web]
        default: both

permissions:
  contents: read
  pull-requests: read

env:
  PROJECT_ID: aibuildergc
  REGION: asia-south1
  WIF_PROVIDER: projects/82398575445/locations/global/workloadIdentityPools/github/providers/saathi-repo
  DEPLOY_SA: github-deployer@aibuildergc.iam.gserviceaccount.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      web: ${{ steps.pick.outputs.web }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'agent/**'
              - '.github/workflows/ci-cd.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci-cd.yml'
            rules:
              - 'firestore.rules'
              - 'firebase.json'
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            s="${{ inputs.service }}"
            echo "api=$([ "$s" = both ] || [ "$s" = api ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "web=$([ "$s" = both ] || [ "$s" = web ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  check-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile
        run: uv run python -m compileall -q app eval seed

  check-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  deploy-rules:
    # Security rules ship before the code that depends on them
    needs: changes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-firestore-rules
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Deploy Firestore security rules
        run: npx --yes firebase-tools@15.26.0 deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive

  deploy-api:
    needs: [changes, check-api]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://saathi-api-82398575445.asia-south1.run.app/health
    concurrency:
      group: deploy-saathi-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy saathi-api (keeps existing env vars and secrets)
        run: |
          gcloud run deploy saathi-api --source agent --region "$REGION" --project "$PROJECT_ID" --quiet \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA::7}"
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://saathi-api-82398575445.asia-south1.run.app/health && exit 0
            sleep 6
          done
          echo "::error::saathi-api health check failed after deploy" && exit 1

  deploy-web:
    needs: [changes, check-web, deploy-api]
    # API first when both changed; still runs when the API had nothing to deploy
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.web == 'true' && needs.check-web.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://saathi-web-82398575445.asia-south1.run.app
    concurrency:
      group: deploy-saathi-web
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy saathi-web (keeps existing env vars)
        run: |
          gcloud run deploy saathi-web --source web --region "$REGION" --project "$PROJECT_ID" --quiet \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA::7}"
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://saathi-web-82398575445.asia-south1.run.app/login)
            [ "$code" = 200 ] && echo "login page OK" && exit 0
            sleep 6
          done
          echo "::error::saathi-web /login returned $code after deploy" && exit 1
